<!DOCTYPE html>
<html>
<head>
  <title>AtmoPixel Blueprint</title>
  <style>
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1, h2, h3 { color: #111; }
    h1 { border-bottom: 2px solid #eaeaea; padding-bottom: 10px; }
    h2 { border-bottom: 1px solid #eaeaea; padding-bottom: 8px; margin-top: 30px; }
    code { background: #f4f4f4; padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 14px; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 8px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; }
    @media print {
      body { margin: 0; max-width: none; font-size: 12pt; }
      @page { margin: 2cm; }
    }
  </style>
</head>
<body>
  ${html}
</body>
</html>
